<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="The personal portfolio of John Benedict Javier: developer, technology enthusiast, and emerging leader."
    />
    <meta name="theme-color" content="#07111f" />
    <meta property="og:title" content="John Benedict Javier | Portfolio" />
    <meta
      property="og:description"
      content="Explore my work, skills, education, awards, and leadership journey."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Manrope:wght@500;600;700;800&amp;family=Space+Mono:wght@400;700&amp;display=swap"
      rel="stylesheet"
    />
    <script>
      (() => {
        const saved = localStorage.getItem("javier-portfolio-theme");
        const systemLight = window.matchMedia("(prefers-color-scheme: light)").matches;
        document.documentElement.dataset.theme = saved || (systemLight ? "light" : "dark");
      })();
    </script>
    <title>John Benedict Javier | Portfolio</title>
  </head>
  <body>
    <noscript>This portfolio needs JavaScript enabled to display its interactive content.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
